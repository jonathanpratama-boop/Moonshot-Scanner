[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-scanner"
version = "0.1.0"
description = "ASTRA local US-equities research scanner prototype (research only; no order placement)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
astra = "astra.cli:main"

[tool.setuptools.packages.find]
include = ["astra*"]

[tool.setuptools.package-data]
astra = ["migrations/*.sql", "web/templates/*.html", "config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
